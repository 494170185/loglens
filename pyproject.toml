[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "A terminal log analysis toolkit built on the Python standard library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# zero runtime dependencies by design

[project.scripts]
loglens = "loglens.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
include = ["loglens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
